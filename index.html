<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MSTC Blockchain | MSTCയെ അറിയാം</title>

<meta name="description"
content="MSTC Blockchain എന്താണ്, എങ്ങനെ പ്രവർത്തിക്കുന്നു, Layer-1, EVM, Validator, NFT, RWA, DeFi തുടങ്ങിയവ മലയാളത്തിൽ മനസ്സിലാക്കാം.">

<meta name="author" content="AJJRA TECHNO HUB">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

body{
    font-family:
    "Noto Sans Malayalam",
    "Nirmala UI",
    Arial,
    sans-serif;
    background:#050b12;
    color:#f4f8fb;
    line-height:1.8;
}

a{
    text-decoration:none;
    color:inherit;
}

.container{
    width:92%;
    max-width:1150px;
    margin:auto;
}

/* NAVBAR */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(5,11,18,.95);
    backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(255,255,255,.08);
}

.nav{
    min-height:70px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:1px;
}

.logo span{
    color:#31ef79;
}

.nav-links{
    display:flex;
    gap:22px;
    font-size:14px;
}

.nav-links a{
    color:#b8c4d2;
}

.nav-links a:hover{
    color:#31ef79;
}

/* BUTTON */

.btn{
    display:inline-block;
    padding:14px 25px;
    border-radius:12px;
    font-weight:900;
    transition:.25s;
}

.btn-primary{
    background:#31ef79;
    color:#031008;
}

.btn-primary:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 35px rgba(49,239,121,.25);
}

.btn-outline{
    border:1px solid #31ef79;
    color:#31ef79;
}

.btn-outline:hover{
    background:#31ef79;
    color:#031008;
}

/* HERO */

.hero{
    min-height:720px;
    display:flex;
    align-items:center;
    background:
    radial-gradient(circle at 10% 20%,rgba(49,239,121,.15),transparent 30%),
    radial-gradient(circle at 90% 20%,rgba(35,100,255,.14),transparent 30%);
}

.hero-grid{
    display:grid;
    grid-template-columns:1.2fr .8fr;
    gap:50px;
    align-items:center;
}

.badge{
    display:inline-block;
    padding:7px 14px;
    border:1px solid rgba(49,239,121,.35);
    background:rgba(49,239,121,.08);
    color:#31ef79;
    border-radius:30px;
    font-size:13px;
    font-weight:bold;
    margin-bottom:20px;
}

.hero h1{
    font-size:clamp(43px,7vw,75px);
    line-height:1.12;
    margin-bottom:25px;
}

.hero h1 span{
    color:#31ef79;
}

.hero p{
    color:#adb9c8;
    font-size:18px;
    max-width:700px;
    margin-bottom:30px;
}

.buttons{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
}

/* HERO CARD */

.hero-card{
    background:linear-gradient(145deg,#111e2d,#08121e);
    border:1px solid rgba(255,255,255,.09);
    padding:35px;
    border-radius:28px;
    box-shadow:0 25px 80px rgba(0,0,0,.35);
}

.coin{
    width:155px;
    height:155px;
    border-radius:50%;
    background:#31ef79;
    color:#031008;
    margin:0 auto 25px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    font-weight:900;
    box-shadow:0 0 70px rgba(49,239,121,.22);
}

.hero-card h2{
    text-align:center;
    margin-bottom:8px;
}

.hero-card p{
    text-align:center;
    font-size:14px;
    margin:0;
}

/* SECTION */

section{
    padding:90px 0;
}

.section-title{
    text-align:center;
    max-width:800px;
    margin:0 auto 50px;
}

.section-title h2{
    font-size:40px;
    line-height:1.3;
    margin-bottom:14px;
}

.section-title p{
    color:#9eabb9;
}

/* CARDS */

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.card{
    background:#0b1521;
    border:1px solid rgba(255,255,255,.08);
    padding:28px;
    border-radius:20px;
    transition:.25s;
}

.card:hover{
    transform:translateY(-5px);
    border-color:rgba(49,239,121,.35);
}

.icon{
    font-size:34px;
    margin-bottom:12px;
}

.card h3{
    margin-bottom:10px;
}

.card p{
    color:#aab6c5;
    font-size:15px;
}

/* ABOUT */

.about-intro{
    max-width:900px;
    margin:auto;
    text-align:center;
    color:#b4c0cd;
    font-size:17px;
}

/* TECHNOLOGY */

.dark-section{
    background:#07101a;
}

.tech-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:22px;
}

.tech-box{
    background:#0b1521;
    border:1px solid rgba(255,255,255,.08);
    padding:30px;
    border-radius:20px;
}

.tech-box h3{
    color:#31ef79;
    margin-bottom:12px;
}

.tech-box p{
    color:#aab6c5;
}

/* FLOW */

.flow{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
}

.flow-card{
    text-align:center;
    background:#0b1521;
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:25px 15px;
}

.number{
    width:45px;
    height:45px;
    background:#31ef79;
    color:#031008;
    border-radius:50%;
    margin:0 auto 14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
}

/* NETWORK */

.network-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.stat{
    text-align:center;
    padding:30px 15px;
    background:#0b1521;
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
}

.stat strong{
    display:block;
    color:#31ef79;
    font-size:29px;
    margin-bottom:5px;
}

.stat span{
    color:#aab6c5;
    font-size:13px;
}

/* USE CASE */

.use-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.use{
    padding:28px;
    border-radius:20px;
    background:#0b1521;
    border:1px solid rgba(255,255,255,.08);
}

.use h3{
    margin-bottom:10px;
}

.use p{
    color:#aab6c5;
    font-size:14px;
}

/* REGISTRATION */

.register{
    background:
    radial-gradient(circle at 50% 0,
    rgba(49,239,121,.15),
    transparent 50%);
}

.register-box{
    max-width:900px;
    margin:auto;
    text-align:center;
    padding:55px 30px;
    border-radius:28px;
    background:linear-gradient(145deg,#102031,#08121d);
    border:1px solid rgba(49,239,121,.22);
}

.register-box h2{
    font-size:43px;
    line-height:1.3;
    margin-bottom:15px;
}

.register-box > p{
    color:#aab6c5;
    max-width:700px;
    margin:0 auto 25px;
}

.steps{
    max-width:650px;
    margin:30px auto;
    text-align:left;
}

.step{
    background:#07111c;
    border:1px solid rgba(255,255,255,.06);
    padding:15px 18px;
    margin:10px 0;
    border-radius:12px;
}

.step b{
    color:#31ef79;
}

/* FAQ */

.faq{
    max-width:850px;
    margin:auto;
}

details{
    background:#0b1521;
    border:1px solid rgba(255,255,255,.08);
    padding:18px 20px;
    border-radius:14px;
    margin-bottom:12px;
}

summary{
    cursor:pointer;
    font-weight:800;
}

details p{
    color:#aab6c5;
    margin-top:12px;
}

/* WARNING */

.notice{
    max-width:900px;
    margin:auto;
    padding:25px;
    border-radius:18px;
    background:#0b1521;
    border:1px solid rgba(255,255,255,.08);
    color:#9facbb;
    font-size:13px;
}

/* FINAL CTA */

.final{
    text-align:center;
}

.final h2{
    font-size:42px;
    margin-bottom:15px;
}

.final p{
    color:#aab6c5;
    max-width:700px;
    margin:0 auto 25px;
}

/* FOOTER */

footer{
    background:#03070c;
    border-top:1px solid rgba(255,255,255,.08);
    padding:45px 0;
}

.footer{
    text-align:center;
}

.footer-logo{
    font-size:24px;
    font-weight:900;
}

.footer-logo span{
    color:#31ef79;
}

.footer p{
    color:#778596;
    font-size:13px;
    margin-top:8px;
}

.footer-links{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    margin:20px 0;
}

.footer-links a{
    color:#9ba8b7;
    font-size:13px;
}

/* MOBILE */

@media(max-width:850px){

    .nav-links{
        display:none;
    }

    .hero{
        padding:90px 0;
        min-height:auto;
    }

    .hero-grid{
        grid-template-columns:1fr;
    }

    .grid,
    .use-grid,
    .tech-grid{
        grid-template-columns:1fr;
    }

    .network-grid{
        grid-template-columns:1fr 1fr;
    }

    .flow{
        grid-template-columns:1fr 1fr;
    }

}

@media(max-width:500px){

    .hero h1{
        font-size:42px;
    }

    .hero p{
        font-size:16px;
    }

    .network-grid,
    .flow{
        grid-template-columns:1fr;
    }

    .buttons .btn{
        width:100%;
        text-align:center;
    }

    .register-box h2,
    .final h2{
        font-size:33px;
    }
}
</style>
</head>
